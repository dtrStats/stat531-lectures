project:
  type: website
  output-dir: docs
  post-render: scripts/prune-drafts.R
  render:
    - "*.qmd"
  resources:
   - data/movies.csv
   - data/studios.csv
   - data/movies.parquet
   - scripts/make-views.R

website:
  title: "STAT 531: R in the AI Era"
  navbar:
    left:
      - href: index.qmd
        text: Home
  page-footer: "STAT 531: Ethics and Practice of Data Science"
  # Pages marked `draft: true` are not built, linked, or listed until you remove that line.
  draft-mode: gone

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    toc-location: left
    toc-title: "Contents"
    toc-depth: 2
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    grid:
      sidebar-width: 270px
      body-width: 860px
      margin-width: 120px
  revealjs:
    theme: simple
    css: slides.css
    embed-resources: true
    slide-number: true
    width: 1280
    height: 720
    margin: 0.08
    transition: fade
    preview-links: false

execute:
  echo: true
  freeze: auto
